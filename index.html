<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>Biblioteca de músicas</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
  <h1>Biblioteca de músicas</h1>
  <!-- Botões ocultos. Para exibi-los de novo, apague esta linha e a última linha deste bloco (a que fecha o comentário).
  <button class="pri" id="pick">Escolher pasta</button>
  <button id="reopen" hidden></button>
  <button id="exp">Exportar cadastro</button>
  <button onclick="imp.click()">Importar cadastro</button>
  -->
  <button id="theme"></button>
  <input type="file" id="imp" accept=".json" hidden>
  <input type="file" id="fallback" webkitdirectory multiple hidden>
</header>
<main id="view"></main>

<footer id="bar">
  <div class="np"><div class="cover sm" id="npc">♪</div><div><b id="npt">Nada tocando</b><small id="npa"></small></div></div>
  <div class="ctl"><button id="prev" title="Anterior">⏮</button><button id="pp" class="pri" title="Tocar/pausar">▶</button><button id="next" title="Próxima">⏭</button></div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="modes"><button id="shuf">⇄</button><button id="rep">↻</button></div>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="1" title="Volume">
</footer>
<audio id="au"></audio>
<dialog id="dlg"></dialog>

<script src="scripts.js"></script>
</body>
</html>
